version: 2
updates:
  - package-ecosystem: "pip"
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    directory: "/python"
    schedule:
      interval: weekly
    assignees:
      - "jeremytwfortune"
    groups:
      minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "npm"
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    directory: "/typescript"
    schedule:
      interval: weekly
    assignees:
      - "jeremytwfortune"
    ignore:
      # typescript-eslint doesn't support TS 7.0; revisit when 7.1 ships its API.
      - dependency-name: "typescript"
        versions: [">=7.0.0 <7.1.0"]
    groups:
      minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "github-actions"
    cooldown:
      default-days: 7
    directory: "/"
    schedule:
      interval: weekly
    assignees:
      - "jeremytwfortune"
    groups:
      minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
